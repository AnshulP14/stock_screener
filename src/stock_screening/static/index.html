<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Research</title>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --user-bg: #1e3a5f;
    --tool-bg: #1a2230;
    --success: #22c55e;
    --warning: #f59e0b;
  }

  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }
  header span { font-size: 0.78rem; color: var(--muted); }
  .hdr-btn {
    font-size: 0.78rem;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .hdr-btn:hover { color: var(--text); border-color: var(--muted); }

  #refresh-panel {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: none;
    flex-shrink: 0;
  }
  #refresh-panel.open { display: block; }

  /* Stage pipeline */
  #refresh-stages {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0;
    margin-bottom: 10px;
  }
  .stage {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--muted);
    padding: 4px 0;
  }
  .stage + .stage::before {
    content: "›";
    margin: 0 8px;
    color: var(--border);
    font-size: 0.9rem;
  }
  .stage-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }
  .stage.pending .stage-dot { background: var(--border); }
  .stage.running .stage-dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .stage.done .stage-dot { background: var(--success); }
  .stage.failed .stage-dot { background: #ef4444; }
  .stage.running { color: var(--text); }
  .stage.done { color: #94a3b8; }
  .stage-name { font-weight: 500; }
  .stage-detail { font-size: 0.73rem; color: var(--muted); }

  /* Progress bar */
  #refresh-progress {
    margin-bottom: 10px;
    display: none;
  }
  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-text { font-size: 0.75rem; color: var(--muted); }

  /* Raw log */
  #refresh-log-wrap {
    font-size: 0.75rem;
    color: var(--muted);
  }
  #refresh-log-wrap > summary {
    cursor: pointer;
    list-style: none;
    color: var(--muted);
    font-size: 0.75rem;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 4px;
  }
  #refresh-log-wrap > summary::before { content: "▶"; font-size: 0.6em; transition: transform 0.15s; }
  #refresh-log-wrap[open] > summary::before { transform: rotate(90deg); }
  #refresh-log-wrap > summary:hover { color: var(--text); }
  #refresh-log {
    font-family: "SF Mono", "Fira Code", monospace;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    max-height: 160px;
    overflow-y: auto;
    white-space: pre-wrap;
    color: #64748b;
    font-size: 0.73rem;
  }
  .log-ok { color: var(--success); }
  .log-err { color: #ef4444; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .msg { display: flex; flex-direction: column; gap: 6px; max-width: 820px; width: 100%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 0.93rem;
  }
  .msg.user .bubble {
    background: var(--user-bg);
    border-bottom-right-radius: 4px;
    max-width: 600px;
  }
  .msg.assistant .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    width: 100%;
  }

  /* Markdown content */
  .bubble h1,.bubble h2,.bubble h3 { margin: 0.8em 0 0.4em; font-size: 1em; font-weight: 600; }
  .bubble p { margin: 0.4em 0; }
  .bubble ul,.bubble ol { padding-left: 1.4em; margin: 0.4em 0; }
  .bubble li { margin: 0.2em 0; }
  .bubble code { background: #0f1117; padding: 1px 5px; border-radius: 4px; font-size: 0.88em; font-family: monospace; }
  .bubble pre { background: #0f1117; padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 0.6em 0; }
  .bubble pre code { background: none; padding: 0; }
  .bubble table { border-collapse: collapse; width: 100%; margin: 0.6em 0; font-size: 0.88em; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
  .bubble th { background: var(--tool-bg); font-weight: 600; }
  .bubble strong { font-weight: 600; color: #f1f5f9; }
  .bubble a { color: var(--accent); text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 0.8em 0; }

  /* Steps (routing + tool calls) */
  .steps { display: flex; flex-direction: column; gap: 4px; }
  .step {
    font-size: 0.8rem;
    color: var(--muted);
    background: var(--tool-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .step > summary {
    padding: 6px 10px;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }
  .step > summary:hover { color: var(--text); }
  .step > summary::before { content: "▶"; font-size: 0.65em; transition: transform 0.15s; }
  .step[open] > summary::before { transform: rotate(90deg); }
  .step-icon { opacity: 0.7; }

  .step-sections { padding: 6px 10px 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
  .step-sub { border: 1px solid #252836; border-radius: 6px; overflow: hidden; }
  .step-sub > summary {
    padding: 4px 8px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 5px;
    user-select: none;
    background: #141620;
  }
  .step-sub > summary::before { content: "▶"; font-size: 0.6em; transition: transform 0.15s; }
  .step-sub[open] > summary::before { transform: rotate(90deg); }
  .step-sub > summary:hover { color: var(--text); }
  .step-code {
    padding: 8px 10px;
    font-size: 0.78rem;
    font-family: "SF Mono", "Fira Code", monospace;
    white-space: pre-wrap;
    word-break: break-all;
    color: #94a3b8;
    max-height: 320px;
    overflow-y: auto;
    border-top: 1px solid #252836;
    background: #0d0f18;
  }
  .pending-dot { color: var(--warning); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .route-badge {
    font-size: 0.78rem;
    color: var(--muted);
    padding: 4px 8px;
    background: var(--tool-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .route-badge .agent { color: var(--success); font-weight: 600; }

  .suggestion {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 10px;
    background: var(--tool-bg);
    border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0;
    margin-top: 4px;
    cursor: pointer;
  }
  .suggestion:hover { color: var(--text); }

  .typing { color: var(--muted); font-size: 0.85rem; padding: 6px 0; }

  /* Cost badge */
  .cost { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  /* Input area */
  #input-area {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #query {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.93rem;
    padding: 10px 14px;
    resize: none;
    line-height: 1.5;
    min-height: 42px;
    max-height: 160px;
    outline: none;
    font-family: inherit;
  }
  #query:focus { border-color: var(--accent); }
  #query::placeholder { color: var(--muted); }
  #send-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    height: 42px;
    white-space: nowrap;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .mode-pills { display: flex; gap: 4px; }
  .mode-pill {
    font-size: 0.75rem;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 10px;
    height: 42px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: color 0.1s, border-color 0.1s, background 0.1s;
  }
  .mode-pill:hover { color: var(--text); border-color: var(--muted); }
  .mode-pill.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(59,130,246,0.1);
  }

  #examples {
    padding: 0 20px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .example-pill {
    font-size: 0.78rem;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    cursor: pointer;
    background: none;
  }
  .example-pill:hover { color: var(--text); border-color: var(--muted); }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    padding-bottom: 60px;
  }
  .empty-state h2 { font-size: 1.1rem; color: var(--text); font-weight: 600; }
  .empty-state p { font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Stock Research</h1>
    <span>NSE500 · Fundamental analysis</span>
  </div>
  <div style="display:flex;gap:8px">
    <button class="hdr-btn" id="refresh-toggle-btn">Refresh data</button>
    <button class="hdr-btn" id="clear-btn">Clear chat</button>
  </div>
</header>

<div id="refresh-panel">
  <div id="refresh-stages">
    <div class="stage pending" id="stage-sync">
      <span class="stage-dot"></span>
      <span class="stage-name">Sync Universe</span>
      <span class="stage-detail"></span>
    </div>
    <div class="stage pending" id="stage-fetch">
      <span class="stage-dot"></span>
      <span class="stage-name">Fetch Data</span>
      <span class="stage-detail"></span>
    </div>
    <div class="stage pending" id="stage-rebuild">
      <span class="stage-dot"></span>
      <span class="stage-name">Rebuild</span>
      <span class="stage-detail"></span>
    </div>
    <div class="stage pending" id="stage-sh">
      <span class="stage-dot"></span>
      <span class="stage-name">Shareholding</span>
      <span class="stage-detail"></span>
    </div>
    <div class="stage pending" id="stage-cr">
      <span class="stage-dot"></span>
      <span class="stage-name">Credit Ratings</span>
      <span class="stage-detail"></span>
    </div>
  </div>
  <div id="refresh-progress">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="progress-text" id="progress-text"></span>
  </div>
  <details id="refresh-log-wrap">
    <summary>Raw log</summary>
    <div id="refresh-log"></div>
  </details>
</div>

<div id="messages">
  <div class="empty-state" id="empty">
    <h2>What would you like to research?</h2>
    <p>Screen stocks by fundamentals or analyse individual companies</p>
  </div>
</div>

<div id="examples">
  <button class="example-pill">High-ROE IT stocks with low debt</button>
  <button class="example-pill">Value stocks in pharma sector</button>
  <button class="example-pill">Analyse TCS fundamentals</button>
  <button class="example-pill">Compare HDFC Bank vs ICICI Bank</button>
  <button class="example-pill">Top 10 stocks by market cap</button>
  <button class="example-pill">FMCG stocks with high dividend yield</button>
</div>

<div id="input-area">
  <textarea id="query" rows="1" placeholder="Ask about stocks, sectors, or companies…"></textarea>
  <div class="mode-pills">
    <button class="mode-pill" data-mode="screening" title="Force screener (fundamental data)">Screener</button>
    <button class="mode-pill" data-mode="web_search" title="Force web search (news & events)">Web</button>
  </div>
  <button id="send-btn">Send</button>
</div>

<script>
(function () {
  let sessionId = localStorage.getItem('session_id') || null;
  let busy = false;
  let forceAgent = null; // null = auto routing

  const messagesEl = document.getElementById('messages');
  const queryEl = document.getElementById('query');
  const sendBtn = document.getElementById('send-btn');
  const emptyEl = document.getElementById('empty');
  const examples = document.querySelectorAll('.example-pill');
  const clearBtn = document.getElementById('clear-btn');

  marked.setOptions({ breaks: true, gfm: true });

  // Auto-resize textarea
  queryEl.addEventListener('input', () => {
    queryEl.style.height = 'auto';
    queryEl.style.height = Math.min(queryEl.scrollHeight, 160) + 'px';
  });

  queryEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  sendBtn.addEventListener('click', send);

  examples.forEach(pill => {
    pill.addEventListener('click', () => {
      queryEl.value = pill.textContent;
      queryEl.dispatchEvent(new Event('input'));
      send();
    });
  });

  // Mode pill toggles
  document.querySelectorAll('.mode-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      if (forceAgent === mode) {
        forceAgent = null;
        btn.classList.remove('active');
      } else {
        forceAgent = mode;
        document.querySelectorAll('.mode-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
    });
  });

  clearBtn.addEventListener('click', async () => {
    if (sessionId) {
      await fetch('/session/clear', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId }),
      });
      sessionId = null;
      localStorage.removeItem('session_id');
    }
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyEl);
    emptyEl.style.display = 'flex';
  });

  function send() {
    const msg = queryEl.value.trim();
    if (!msg || busy) return;
    if (emptyEl) emptyEl.style.display = 'none';
    appendUserMsg(msg);
    queryEl.value = '';
    queryEl.style.height = 'auto';
    const assistantEl = appendAssistantMsg();
    streamResponse(msg, assistantEl);
  }

  function appendUserMsg(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    messagesEl.appendChild(div);
    scrollBottom();
  }

  function appendAssistantMsg() {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `
      <div class="steps" id="steps-${Date.now()}"></div>
      <div class="bubble" style="display:none"></div>
    `;
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  async function streamResponse(message, container) {
    busy = true;
    sendBtn.disabled = true;
    const stepsEl = container.querySelector('.steps');
    const bubbleEl = container.querySelector('.bubble');

    const typingEl = document.createElement('div');
    typingEl.className = 'typing';
    typingEl.textContent = 'Thinking…';
    stepsEl.appendChild(typingEl);
    scrollBottom();

    try {
      const resp = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, session_id: sessionId, force_agent: forceAgent }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          let evt;
          try { evt = JSON.parse(part.slice(6)); } catch { continue; }
          handleEvent(evt, stepsEl, bubbleEl, typingEl);
        }
      }
    } catch (e) {
      typingEl.textContent = 'Error: ' + e.message;
    } finally {
      busy = false;
      sendBtn.disabled = false;
    }
  }

  function handleEvent(evt, stepsEl, bubbleEl, typingEl) {
    if (evt.type === 'session') {
      sessionId = evt.session_id;
      localStorage.setItem('session_id', sessionId);

    } else if (evt.type === 'routing') {
      typingEl.remove();
      const d = evt.decision || {};
      const badge = document.createElement('div');
      badge.className = 'route-badge';
      badge.innerHTML = `<span>Routing to</span><span class="agent">${escapeHtml(d.agent || '')}</span>`;
      stepsEl.appendChild(badge);
      scrollBottom();

    } else if (evt.type === 'tool_call') {
      const name = evt.name || 'tool';
      const args = evt.args || {};
      const argsStr = JSON.stringify(args, null, 2);
      const tcId = evt.tool_call_id || '';
      const det = document.createElement('details');
      det.className = 'step';
      det.dataset.toolCallId = tcId;
      det.innerHTML = `
        <summary><span class="step-icon">⚙</span><strong>${escapeHtml(name)}</strong>${summariseArgs(args)}</summary>
        <div class="step-sections">
          <details class="step-sub" open>
            <summary>Input</summary>
            <pre class="step-code">${escapeHtml(argsStr)}</pre>
          </details>
          <details class="step-sub" data-output="${escapeHtml(tcId)}">
            <summary>Output <span class="pending-dot">●</span></summary>
            <pre class="step-code">waiting…</pre>
          </details>
        </div>`;
      stepsEl.appendChild(det);
      det.open = true;
      scrollBottom();

    } else if (evt.type === 'final') {
      const response = evt.response || {};
      const trace = evt.trace || {};
      const toolResults = evt.tool_results || {};

      // Populate output sections for each tool call
      stepsEl.querySelectorAll('.step[data-tool-call-id]').forEach(det => {
        const tcId = det.dataset.toolCallId;
        const outputDet = det.querySelector(`[data-output="${tcId}"]`);
        if (!outputDet) return;
        const pre = outputDet.querySelector('.step-code');
        const dot = outputDet.querySelector('.pending-dot');
        if (dot) dot.remove();
        if (tcId && toolResults[tcId]) {
          pre.textContent = toolResults[tcId];
          outputDet.open = true;
        } else {
          pre.textContent = '(no output)';
        }
      });

      bubbleEl.style.display = '';
      bubbleEl.innerHTML = marked.parse(response.message || '');

      if (response.follow_up_suggestion) {
        const sug = document.createElement('div');
        sug.className = 'suggestion';
        sug.textContent = '💡 ' + response.follow_up_suggestion;
        sug.title = 'Click to ask this';
        sug.addEventListener('click', () => {
          queryEl.value = response.follow_up_suggestion;
          queryEl.dispatchEvent(new Event('input'));
          queryEl.focus();
        });
        stepsEl.parentElement.appendChild(sug);
      }

      if (trace && (trace.cost_usd || trace.total_tokens)) {
        const cost = document.createElement('div');
        cost.className = 'cost';
        const parts = [];
        if (trace.total_tokens) parts.push(`${trace.total_tokens.toLocaleString()} tokens`);
        if (trace.cost_usd) parts.push(`$${trace.cost_usd.toFixed(4)}`);
        if (trace.duration_ms) parts.push(`${(trace.duration_ms / 1000).toFixed(1)}s`);
        cost.textContent = parts.join(' · ');
        stepsEl.parentElement.appendChild(cost);
      }

      scrollBottom();

    } else if (evt.type === 'error') {
      const err = document.createElement('div');
      err.style.cssText = 'color:#ef4444;font-size:0.85rem;padding:6px 0';
      err.textContent = 'Error: ' + (evt.message || 'unknown');
      stepsEl.appendChild(err);
      scrollBottom();
    }
  }

  function summariseArgs(args) {
    if (!args || typeof args !== 'object') return '';
    const parts = Object.entries(args)
      .filter(([, v]) => v !== null && v !== undefined && v !== '')
      .slice(0, 3)
      .map(([k, v]) => {
        const s = Array.isArray(v) ? v.join(',') : String(v);
        return `${k}=${s.length > 20 ? s.slice(0, 20) + '…' : s}`;
      });
    return parts.length ? '<span style="color:#475569;margin-left:6px;font-weight:400">(' + escapeHtml(parts.join(', ')) + ')</span>' : '';
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  queryEl.focus();

  // --- Refresh ---
  const refreshBtn = document.getElementById('refresh-toggle-btn');
  const refreshPanel = document.getElementById('refresh-panel');
  const refreshLog = document.getElementById('refresh-log');
  const progressEl = document.getElementById('refresh-progress');
  const progressFill = document.getElementById('progress-fill');
  const progressText = document.getElementById('progress-text');
  let _pollTimer = null;

  const STAGES = [
    { id: 'stage-sync',    triggers: ['MODE: SYNC UNIVERSE', 'STARTING SYNC'] },
    { id: 'stage-fetch',   triggers: ['STOCKS WITH'] },  // "Fetching N stocks with W workers"
    { id: 'stage-rebuild', triggers: ['REBUILDING INDICES', 'REBUILDING INDICES (IN CASE'] },
    { id: 'stage-sh',      triggers: ['UPDATING SHAREHOLDING', 'SHAREHOLDING:'] },
    { id: 'stage-cr',      triggers: ['UPDATING CREDIT', 'CREDIT RATINGS:'] },
  ];

  let _activeStage = null;

  function setStage(stageId, status, detail) {
    const el = document.getElementById(stageId);
    if (!el) return;
    el.className = 'stage ' + status;
    if (detail !== undefined) el.querySelector('.stage-detail').textContent = detail;
  }

  function resetStages() {
    STAGES.forEach(s => setStage(s.id, 'pending', ''));
    progressEl.style.display = 'none';
    progressFill.style.width = '0%';
    progressText.textContent = '';
    _activeStage = null;
  }

  function processLine(line) {
    const upper = line.toUpperCase();

    // Detect stage transitions
    for (const stage of STAGES) {
      if (stage.triggers.some(t => upper.includes(t))) {
        if (_activeStage && _activeStage !== stage.id) {
          setStage(_activeStage, 'done');
        }
        if (_activeStage !== stage.id) {
          setStage(stage.id, 'running');
          _activeStage = stage.id;
        }
        break;
      }
    }

    // Progress bar: "[45/120] 40 ok  0 skipped  5 failed"
    const progMatch = line.match(/\[(\d+)\/(\d+)\]/);
    if (progMatch) {
      const cur = parseInt(progMatch[1]), total = parseInt(progMatch[2]);
      const pct = total > 0 ? Math.round(cur / total * 100) : 0;
      progressEl.style.display = 'block';
      progressFill.style.width = pct + '%';
      progressText.textContent = `${cur} / ${total} (${pct}%)`;
      // Extract ok/failed counts
      const okM = line.match(/(\d+)\s+ok/);
      const failM = line.match(/(\d+)\s+failed/);
      if (okM || failM) {
        const parts = [];
        if (okM) parts.push(okM[1] + ' ok');
        if (failM && parseInt(failM[1]) > 0) parts.push(failM[1] + ' failed');
        if (parts.length) progressText.textContent += ' · ' + parts.join('  ');
      }
      if (_activeStage) setStage(_activeStage, 'running', `${cur}/${total}`);
      return; // don't show tqdm-style lines in raw log
    }

    // Shareholding / credit summary line → update stage detail
    const shMatch = line.match(/Shareholding:\s*(\d+)\s+updated/i);
    if (shMatch) setStage('stage-sh', 'done', shMatch[1] + ' updated');

    const crMatch = line.match(/Credit ratings:\s*(\d+)\s+updated/i);
    if (crMatch) setStage('stage-cr', 'done', crMatch[1] + ' updated');

    // Sync detail lines
    const removedMatch = line.match(/Removed (\d+) delisted/i);
    if (removedMatch) setStage('stage-sync', 'running', 'removed ' + removedMatch[1]);

    const addedMatch = line.match(/Found (\d+) new stocks/i);
    if (addedMatch) {
      const current = document.getElementById('stage-sync').querySelector('.stage-detail').textContent;
      setStage('stage-sync', 'running', (current ? current + ' · ' : '') + 'added ' + addedMatch[1]);
    }
  }

  function finishRefresh(ok) {
    progressEl.style.display = 'none';
    if (_activeStage) setStage(_activeStage, ok ? 'done' : 'failed');
    // Mark remaining pending stages as done if job succeeded
    if (ok) {
      STAGES.forEach(s => {
        const el = document.getElementById(s.id);
        if (el && el.classList.contains('pending')) setStage(s.id, 'done');
      });
    }
    refreshBtn.disabled = false;
    refreshBtn.textContent = 'Refresh data';
    _pollTimer = null;
  }

  function appendLine(text, cls) {
    const el = document.createElement('div');
    el.textContent = text;
    if (cls) el.className = cls;
    refreshLog.appendChild(el);
    refreshLog.scrollTop = refreshLog.scrollHeight;
  }

  function startPolling(fromLine) {
    if (_pollTimer) return;
    async function poll() {
      try {
        const r = await fetch('/data/refresh/status?from_line=' + fromLine);
        const s = await r.json();
        for (const line of s.lines) {
          processLine(line);
          appendLine(line);
        }
        fromLine = s.total_lines;
        if (s.done) {
          const last = refreshLog.lastElementChild;
          if (last) last.className = s.ok ? 'log-ok' : 'log-err';
          finishRefresh(s.ok);
          return;
        }
      } catch (_) {}
      _pollTimer = setTimeout(poll, 2000);
    }
    _pollTimer = setTimeout(poll, 500);
  }

  // Resume polling if a job is already running when the page loads
  (async () => {
    try {
      const r = await fetch('/data/refresh/status?from_line=0');
      const s = await r.json();
      if (s.running || (s.done && s.lines.length)) {
        refreshPanel.classList.add('open');
        resetStages();
        for (const line of s.lines) {
          processLine(line);
          appendLine(line);
        }
        if (s.done) {
          const last = refreshLog.lastElementChild;
          if (last) last.className = s.ok ? 'log-ok' : 'log-err';
          finishRefresh(s.ok);
        } else {
          refreshBtn.disabled = true;
          refreshBtn.textContent = 'Refreshing…';
          startPolling(s.total_lines);
        }
      }
    } catch (_) {}
  })();

  refreshBtn.addEventListener('click', async () => {
    if (refreshBtn.disabled) return;
    refreshBtn.disabled = true;
    refreshBtn.textContent = 'Refreshing…';
    refreshLog.innerHTML = '';
    resetStages();
    refreshPanel.classList.add('open');
    try {
      await fetch('/data/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'sync' }),
      });
    } catch (e) {
      appendLine('Error: ' + e.message, 'log-err');
      refreshBtn.disabled = false;
      refreshBtn.textContent = 'Refresh data';
      return;
    }
    startPolling(0);
  });
})();
</script>
</body>
</html>
