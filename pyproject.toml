[project]
name = "stock_screening"
version = "0.1.0"
description = "Multi-agent stock analysis with Pydantic AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai>=0.0.14",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "typing-extensions>=4.0",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "gradio>=6.5.1",
    "pypdf>=4.0",
    "pdfplumber>=0.10",
    "lxml>=5.0",
    "tenacity>=8.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_screening"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
]
