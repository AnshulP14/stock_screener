[project]
name = "stock-screener"
version = "0.1.0"
description = "NSE500 + S&P500 fundamental data set and screening tools, driven by a coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "tqdm>=4.66",
    "lxml>=5.0",
    "pypdf>=4.0",
    "pdfplumber>=0.10",
    "duckdb>=1.0",
    "curl_cffi>=0.7",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    # This is a single-machine local batch pipeline over calendar-date fiscal
    # concepts (fiscal years/quarters, cache age, staleness) -- there is no
    # timezone ambiguity to guard against, and `date` objects have no tzinfo
    # concept to add in the first place.
    "DTZ005",  # datetime.now() without tz
    "DTZ011",  # date.today()
    "DTZ012",  # date.fromtimestamp() without tz
    # Batch fetch/parse loops (scraping, PDF/HTML indexing) deliberately catch
    # any exception so one bad symbol/file doesn't kill a multi-hundred-item
    # run -- narrowing to specific exception types would defeat that and risk
    # missing real failures from bs4/lxml/network/JSON call sites.
    "BLE001",  # blind except Exception
]
